<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jakompiled · extraer ISO</title>
  <style>
    :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; --ok: #2f7d32; --err: #b3261e; --bar: #d8d8d2; --fill: #3b6ea8; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --ok: #7bc47f; --err: #f28b82; --bar: #33332f; --fill: #7aa7d9; }
    }
    :root[data-theme="dark"] { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --ok: #7bc47f; --err: #f28b82; --bar: #33332f; --fill: #7aa7d9; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; max-width: 960px; }
    h1 { font-size: 1.2rem; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: var(--muted); }
    #status { font-weight: 600; margin: 12px 0 4px; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
    progress { width: 100%; height: 10px; accent-color: var(--fill); }
    pre { font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; margin: 12px 0 0; max-height: 60vh; overflow: auto; }
  </style>
</head>
<body>
  <h1>Jakompiled · extraer los datos de tu ISO de Jak II</h1>
  <p>
    Elige tu ISO de <b>Jak II (NTSC-U, SCUS-97265)</b>. Se lee aquí, en tu navegador: no se sube a
    ningún sitio. Los ficheros extraídos se guardan en el almacenamiento privado de esta página (OPFS).
  </p>
  <input type="file" id="iso" accept=".iso">
  <div id="status"></div>
  <progress id="progress" max="1" value="0" hidden></progress>
  <pre id="log"></pre>
  <script>
    const $ = (id) => document.getElementById(id);
    const log = (t) => { $("log").textContent += t + "\n"; console.log(t); };
    const status = (t, cls) => { $("status").textContent = t; $("status").className = cls ?? ""; };
    if (!crossOriginIsolated) status("Falta aislamiento cross-origin (COOP/COEP): sirve la página con web/serve.mjs.", "err");

    function start(file, steps) {
      const worker = new Worker("extract-worker.js");
      const t0 = performance.now();
      let lastFile = "";
      worker.onmessage = ({ data }) => {
        if (data.log !== undefined) log(data.log.replace(/\x1b\[[0-9;]*m/g, ""));
        if (data.progress) {
          const { done, total, file } = data.progress;
          $("progress").hidden = false;
          $("progress").value = done / total;
          if (file !== lastFile) { lastFile = file; status(`Copiando la ISO a OPFS: ${file} (${(100 * done / total).toFixed(1)} %)`); }
        }
        if (data.done) {
          const secs = ((performance.now() - t0) / 1000).toFixed(0);
          if (data.done.ok) status(`Extracción terminada en ${secs} s.`, "ok");
          else status(`La extracción falló (código ${data.done.code ?? data.done.error}). Mira el registro.`, "err");
          log(`[test] extraction ok=${data.done.ok} code=${data.done.code ?? ""}`);
          $("progress").hidden = true;
        }
      };
      status("Leyendo la ISO…");
      worker.postMessage({ iso: file, steps });
    }

    $("iso").onchange = () => { if ($("iso").files[0]) start($("iso").files[0], ["iso", "extract"]); };
  </script>
</body>
</html>
