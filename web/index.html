<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jakompiled</title>
  <style>
    :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; --ok: #2f7d32; --err: #b3261e; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --ok: #7bc47f; --err: #f28b82; }
    }
    :root[data-theme="dark"] { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --ok: #7bc47f; --err: #f28b82; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
    h1 { font-size: 1.2rem; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: var(--muted); }
    #status { font-weight: 600; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
    pre { font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; margin: 12px 0 0; }
  </style>
</head>
