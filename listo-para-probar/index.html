<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jakompiled</title>
  <style>
    :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; --ok: #2f7d32; --err: #b3261e; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --ok: #7bc47f; --err: #f28b82; }
    }
    :root[data-theme="dark"] { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --ok: #7bc47f; --err: #f28b82; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
    h1 { font-size: 1.2rem; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: var(--muted); }
    #status { font-weight: 600; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
    #player { position: relative; display: grid; place-items: center; width: 100%; height: min(70vh, 720px); min-height: 180px; background: #000; margin-bottom: 12px; }
    #player[hidden] { display: none; }
    #player:fullscreen { width: 100vw; height: 100vh; min-height: 0; margin: 0; }
    canvas { display: block; width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: contain; }
    #fullscreen { position: absolute; right: 12px; top: 12px; padding: 9px 14px; border: 1px solid #ffffff60; border-radius: 6px; background: #171717dc; color: #fff; font: inherit; cursor: pointer; }
    #fullscreen:hover { background: #333; }
    #fullscreen:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    #player-error { position: absolute; bottom: 12px; margin: 0; padding: 0 12px; color: #fff; background: #171717dc; }
    pre { font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; margin: 12px 0 0; }
  </style>
</head>
<body>
  <h1>Jakompiled · runtime de OpenGOAL en wasm</h1>
  <p>Runtime de OpenGOAL y código GOAL compilados a WebAssembly. <code>?boot=game</code> carga el motor; <code>?display=1</code> activa WebGL 2.</p>
  <div id="player">
    <canvas id="canvas" width="640" height="480" oncontextmenu="event.preventDefault()"></canvas>
    <button id="fullscreen" type="button" hidden>Pantalla completa</button>
    <p id="player-error" role="status" hidden></p>
  </div>
  <div id="status">Cargando…</div>
  <pre id="log"></pre>
  <p id="save-status" role="status" aria-live="polite" hidden></p>
  <script src="gpu-diagnostics.js"></script>
  <script src="saves.js"></script>
  <script src="player.js"></script>
  <script src="boot.js"></script>
  <script src="gk.js"></script>
</body>
</html>
